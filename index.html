<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rômulo Lima atua em Direito Previdenciário, Cível e Trabalhista em Santarém/PA e região."
    />
    <meta name="theme-color" content="#17384f" />
    <title>Rômulo Lima | Advocacia em Santarém/PA</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.getElementById("root").innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#17384f;color:#f8f6ef;font-family:Segoe UI,sans-serif">
            <section style="width:min(100%,640px);padding:40px;border:1px solid #b8a98f;border-radius:16px;background:#102f43;box-shadow:0 24px 70px rgba(0,0,0,.25)">
              <p style="margin:0 0 8px;color:#d4ad72;font-size:13px;letter-spacing:.12em;text-transform:uppercase">Rômulo Lima</p>
              <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:clamp(32px,7vw,54px);font-weight:400;line-height:1">Abra pelo servidor local</h1>
              <p style="margin:0 0 12px;line-height:1.7;color:rgba(248,246,239,.82)">Este projeto usa React e Vite. O navegador não consegue executar a aplicação ao abrir este arquivo diretamente.</p>
              <p style="margin:0;line-height:1.7;color:rgba(248,246,239,.82)">Volte para a pasta do projeto e clique duas vezes em <strong style="color:#fff">abrir-app.bat</strong>.</p>
            </section>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
